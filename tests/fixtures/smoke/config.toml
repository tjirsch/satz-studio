# The app's fixture estate: satz's own smoke estate, read straight from the pinned
# submodule so the files can never drift from the satz release the app targets. Tests
# that WRITE, and tests that open a session, copy the estate to a temporary directory
# first: `satz mcp` opens only an estate file inside the directory holding its
# config.toml, and this one's files are in the submodule. Nothing writes here.
yaml_dir = "../../../vendor/satz/tests/smoke/yaml"
hcl_dir = "hcl"
include_dirs = [".", "../../../vendor/satz/tests/smoke/yaml", "../../../vendor/satz"]
schema_dir = "../../../vendor/satz/tests/schemas"
presets_dir = "../../../vendor/satz/presets"
tf_tool = "tofu"
provider_version = "7.14.1"

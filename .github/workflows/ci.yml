name: ci

# Clippy, tests and a debug build of the app. The satz binary the tests drive is
# the NEWEST satz release, installed by scripts/install-satz.sh from GitHub,
# verified against its SHA-256 sidecar and held to MIN_SATZ or newer (`pub const
# MIN_SATZ` in crates/satz-studio-core/src/satz/binary.rs) — satz keeps only its
# five newest releases, so a release pinned by tag is gone within days; the
# script also writes the runner's satz config with the
# update check off, because satz prints its update notice on stdout and a
# newer release would break every `--format json` test. On Windows satz is
# built from the submodule vendor/satz instead — satz's Windows release installs
# through PowerShell, which install-satz.sh does not run — so the pinned source
# serves there.
#
# Both jobs run once per commit: on a pull request for a branch, on the push for
# `main`. A branch push alone runs nothing, because its pull request runs the same
# jobs on the branch merged into `main` — running on both is every commit tested
# twice. `core` is on ubuntu and `platforms` on macOS and Windows, which have their own
# webview, their own keyring store and, on Windows, a satz built from the submodule. A
# release tag and a manual dispatch run both as well, so release.yml bundles a tree
# they have passed on.
#
# macOS is Apple silicon alone, here and in release.yml (Thomas, 2026-09-18, ADR 0016):
# nothing in this app is architecture-dependent — the webview, the keyring and the satz
# binary are the platform's, not the chip's — and `macos-15-intel` is the most expensive
# runner in the catalogue. An Intel Mac gets no bundle.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: system libraries the desktop crate links
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: satz (the pinned MIN_SATZ release)
        run: |
          bash scripts/install-satz.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: formatting (rustfmt, the two packages — vendor/satz is satz's own)
        run: cargo fmt -p satz-studio-core -p satz-studio -- --check
      - name: clippy (warnings are errors)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: tests
        run: cargo test --workspace --locked --no-fail-fast
      - name: the verification harness (docs/verification.md)
        run: bash scripts/e2e.sh --ci
      - name: build the app
        run: cargo build -p satz-studio --locked

  platforms:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      # GitHub's Windows runners default to core.autocrlf=true, which would check the
      # `.satz` fixtures out with CRLF and break every assertion that compares bytes.
      # It has to be set before the checkout, and globally, so `vendor/satz` — which
      # carries most of the fixtures — is cloned the same way.
      - name: keep line endings as they are committed
        if: runner.os == 'Windows'
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        if: runner.os != 'Windows'
      - uses: Swatinem/rust-cache@v2
        if: runner.os == 'Windows'
        with:
          # the satz build from the submodule is cached beside the app's
          workspaces: |
            . -> target
            vendor/satz -> vendor/satz/target
      - name: satz (the pinned MIN_SATZ release)
        if: runner.os != 'Windows'
        run: |
          bash scripts/install-satz.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: satz (built from the submodule — install-satz.sh does not run the PowerShell installer)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cargo build --release --manifest-path vendor/satz/Cargo.toml --locked
          echo "$GITHUB_WORKSPACE/vendor/satz/target/release" >> "$GITHUB_PATH"
      - name: formatting (rustfmt, the two packages — vendor/satz is satz's own)
        run: cargo fmt -p satz-studio-core -p satz-studio -- --check
      - name: clippy (warnings are errors)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: tests
        run: cargo test --workspace --locked --no-fail-fast
      - name: build the app
        run: cargo build -p satz-studio --locked

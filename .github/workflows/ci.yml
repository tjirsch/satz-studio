name: ci

# Clippy, tests and a debug build of the app. The satz binary the tests drive is
# the NEWEST satz release, installed by scripts/install-satz.sh from GitHub,
# verified against its SHA-256 sidecar and held to MIN_SATZ or newer (`pub const
# MIN_SATZ` in crates/satz-studio-core/src/satz/binary.rs) — satz keeps only its
# five newest releases, so a release pinned by tag is gone within days; the
# script also writes the runner's satz config with the
# update check off, because satz prints its update notice on stdout and a
# newer release would break every `--format json` test. On Windows the same is
# done by a PowerShell step through satz's own satz-installer.ps1, verified against
# its sidecar and run as the app runs it.
#
# Both jobs run once per commit: on a pull request for a branch, on the push for
# `main`. A branch push alone runs nothing, because its pull request runs the same
# jobs on the branch merged into `main` — running on both is every commit tested
# twice. `core` is on ubuntu and `platforms` on macOS and Windows, which have their own
# webview and their own satz installer. A release tag and a manual dispatch run both as well, so release.yml bundles a tree
# they have passed on.
#
# A schedule runs both once a day on `main`, so a satz release that breaks the app is
# seen the day it ships rather than on the next pull request: every run installs the
# newest satz release, and so does this one. A scheduled run that fails also fails
# `report`, which opens an issue — or comments on the one still open — with the run's
# link; it is the only job that writes, and only to issues.
#
# macOS is Apple silicon alone, here and in release.yml (decided 2026-09-18, ADR 0016):
# nothing in this app is architecture-dependent — the webview and the satz binary are
# the platform's, not the chip's — and `macos-15-intel` is the most expensive
# runner in the catalogue. An Intel Mac gets no bundle.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * *'

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: system libraries the desktop crate links
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: satz (the newest release, through scripts/install-satz.sh, held to MIN_SATZ or newer)
        run: |
          bash scripts/install-satz.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: formatting (rustfmt, the two packages — vendor/satz is satz's own)
        run: cargo fmt -p satz-studio-core -p satz-studio -- --check
      - name: clippy (warnings are errors)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: tests
        run: cargo test --workspace --locked --no-fail-fast
      - name: the verification harness (docs/verification.md)
        run: bash scripts/e2e.sh --ci
      - name: build the app
        run: cargo build -p satz-studio --locked
      # cargo-about at the exact version the script names: a different one can read a
      # crate's licence file differently, and the file would then differ between a
      # machine and CI with nothing in the repository having changed. `cargo fetch`
      # unpacks the sources of all three release targets, which the script reads
      # offline.
      - uses: cargo-bins/cargo-binstall@main
      - name: third-party licence texts match Cargo.lock
        run: |
          cargo binstall -y --locked "cargo-about@$(sed -n 's/^WANT=//p' scripts/update-third-party-licenses.sh)"
          cargo fetch --locked
          bash scripts/update-third-party-licenses.sh --check

  platforms:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      # GitHub's Windows runners default to core.autocrlf=true, which would check the
      # `.satz` fixtures out with CRLF and break every assertion that compares bytes.
      # It has to be set before the checkout, and globally, so `vendor/satz` — which
      # carries most of the fixtures — is cloned the same way.
      - name: keep line endings as they are committed
        if: runner.os == 'Windows'
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: satz (the newest release, through scripts/install-satz.sh, held to MIN_SATZ or newer)
        if: runner.os != 'Windows'
        run: |
          bash scripts/install-satz.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      # scripts/install-satz.sh for Windows: the newest release's satz-installer.ps1,
      # verified against its SHA-256 sidecar — a missing sidecar fails the download —
      # run as the app runs it (powershell -File, SATZ_INSTALL_DIR, SATZ_NO_MODIFY_PATH=1)
      # and held to MIN_SATZ or newer, after the runner's satz config is written with the
      # update check off.
      - name: satz (the newest release, through satz-installer.ps1)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $cfg = Join-Path $env:USERPROFILE '.config\satz\satz.toml'
          if (-not (Test-Path $cfg)) {
            New-Item -ItemType Directory -Force -Path (Split-Path $cfg) | Out-Null
            [IO.File]::WriteAllText($cfg, "self_update_frequency = `"never`"`n")
            Write-Output "install-satz: wrote $cfg (self_update_frequency = never)"
          }
          $lines = @(Select-String -Path crates/satz-studio-core/src/satz/binary.rs -Pattern '^pub const MIN_SATZ: &str = "([0-9]+\.[0-9]+\.[0-9]+)";')
          if ($lines.Count -ne 1) { throw "expected exactly one MIN_SATZ line in binary.rs, found $($lines.Count)" }
          $floor = $lines[0].Matches[0].Groups[1].Value
          $base = 'https://github.com/tjirsch/satz/releases/latest/download'
          $tmp = New-Item -ItemType Directory -Path (Join-Path $env:RUNNER_TEMP 'satz-install')
          $ps1 = Join-Path $tmp 'satz-installer.ps1'
          Invoke-WebRequest -Uri "$base/satz-installer.ps1" -OutFile $ps1
          Invoke-WebRequest -Uri "$base/satz-installer.ps1.sha256" -OutFile "$ps1.sha256"
          $expected = ((Get-Content -Raw "$ps1.sha256").Trim() -split '\s+')[0].ToLowerInvariant()
          if ($expected -notmatch '^[0-9a-f]{64}$') { throw "the sidecar is not a SHA-256: $expected" }
          $actual = (Get-FileHash -Algorithm SHA256 -Path $ps1).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "SHA-256 mismatch for satz-installer.ps1: sidecar $expected, downloaded $actual" }
          Write-Output "install-satz: satz-installer.ps1 verified ($actual)"
          $bin = Join-Path $env:USERPROFILE '.local\bin'
          $env:SATZ_INSTALL_DIR = $bin
          $env:SATZ_NO_MODIFY_PATH = '1'
          powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $ps1
          if ($LASTEXITCODE -ne 0) { throw "satz-installer.ps1 exited with $LASTEXITCODE" }
          $satz = Join-Path $bin 'satz.exe'
          if (-not (Test-Path $satz)) { throw "the installer ran but $satz is not there" }
          $said = @(& $satz --version)
          $said | Write-Output
          $found = @($said | Select-String -Pattern '^satz ([0-9]+\.[0-9]+\.[0-9]+)$')
          if ($found.Count -eq 0) { throw "$satz printed no 'satz X.Y.Z' line" }
          $got = $found[-1].Matches[0].Groups[1].Value
          if ([version]$got -lt [version]$floor) { throw "the newest satz release is $got, below MIN_SATZ $floor" }
          Write-Output "install-satz: satz $got (MIN_SATZ $floor)"
          Add-Content -Path $env:GITHUB_PATH -Value $bin
      - name: formatting (rustfmt, the two packages — vendor/satz is satz's own)
        run: cargo fmt -p satz-studio-core -p satz-studio -- --check
      - name: clippy (warnings are errors)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: tests
        run: cargo test --workspace --locked --no-fail-fast
      - name: build the app
        run: cargo build -p satz-studio --locked

  # A scheduled run that failed: an issue with the run's link, or a comment on the one
  # still open under the same title, so a satz release that breaks the app for several
  # days is one issue. Pull requests, pushes, tags and manual runs report in their own
  # checks and skip this job.
  report:
    needs: [core, platforms]
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    permissions:
      issues: write
    steps:
      - name: open or update the issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title='The daily CI run against the newest satz release failed'
          body="The scheduled run of \`ci.yml\` on \`main\` failed: $RUN_URL

          It installs the newest satz release, so a failure the day satz releases is the alarm that the app has fallen behind; the answer is a satz-studio patch release."
          open=$(gh issue list --state open --search "\"$title\" in:title" --json number,title \
            --jq "map(select(.title == \"$title\")) | .[0].number // empty")
          if [ -n "$open" ]; then
            gh issue comment "$open" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi

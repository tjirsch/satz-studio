# satz-studio — the desktop app for satz. Two crates: the headless core, and the
# Dioxus app over it. satz itself is pinned ONCE, as the submodule `vendor/satz`:
# satz-core is a path dependency into it, and the presets, the smoke estates and the
# provider-schema fixture come from the same checkout. `vendor` is excluded from the
# workspace so satz's own workspace stays its own.
[workspace]
resolver = "3"
members = ["crates/satz-studio-core", "crates/satz-studio"]
exclude = ["vendor"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/tjirsch/satz-studio"
rust-version = "1.88"

[workspace.dependencies]
satz-core = { path = "vendor/satz/crates/satz-core" }

serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml = "0.9.34"
toml = "1.1.5"
thiserror = "2.0.20"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
semver = "1.0.28"
sha2 = "0.11.0"
hex = "0.4.3"
dirs = "7.0.0"
which = "8.0.6"
notify = "8.2.0"

tokio = { version = "1.53.1", features = ["rt-multi-thread", "process", "io-util", "sync", "macros", "time", "fs"] }
tokio-util = { version = "0.7.19", features = ["io"] }
futures-util = "0.3.34"
rmcp = { version = "3.2.0", default-features = false, features = ["client", "transport-child-process"] }
reqwest = { version = "0.13.4", features = ["json", "stream"] }

keyring = "4.2.0"
keyring-core = "1.0.0"
apple-native-keyring-store = "1.0.2"
windows-native-keyring-store = "1.1.0"
zbus-secret-service-keyring-store = "1.0.1"

tree-sitter = "0.27.0"
cc = "1.4.2"

dioxus = { version = "0.7.10", features = ["desktop"] }
dioxus-stores = "0.7.10"
rfd = "0.17.2"
open = "5.4.4"

proptest = "1.11.0"
tempfile = "3.27.0"
